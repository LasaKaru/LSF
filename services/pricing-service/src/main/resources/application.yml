spring:
  application:
    name: pricing-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pricing_db}
    username: ${SPRING_DATASOURCE_USERNAME:yathra}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

yathra:
  pricing:
    quote-signing-key: ${QUOTE_SIGNING_KEY}
    quote-ttl-seconds: ${QUOTE_TTL_SECONDS:600}
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8081}
    demand-pricing-enabled: ${DEMAND_PRICING_ENABLED:false}
    demand-multiplier-min: ${DEMAND_MULTIPLIER_MIN:0.90}
    demand-multiplier-max: ${DEMAND_MULTIPLIER_MAX:1.40}
    scenic-surcharge-enabled: ${FEATURE_SCENIC_SURCHARGE_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    lk.yathra: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
