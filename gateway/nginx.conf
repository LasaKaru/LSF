# =============================================================================
# Yathra API gateway.
#
# In production this role is WSO2 API Manager: the OpenAPI specs import directly
# and bring throttling policies, subscription tiers and a developer portal with
# no code change. nginx stands in for it here because the gateway's job in the
# compose topology is routing, CORS and a single origin -- and a 20 MB container
# that starts instantly serves the brief's "one shot from a clean machine"
# requirement far better than another JVM would.
#
# Nothing about the services depends on which gateway is in front of them.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Correlation id: accept the caller's, generate one when absent. The same id
    # is echoed by every service and appears on every log line, so one request
    # can be followed across the whole system.
    map $http_x_correlation_id $correlation_id {
        default   $http_x_correlation_id;
        ""        $request_id;
    }

    log_format json escape=json
        '{"ts":"$time_iso8601","level":"INFO","service":"gateway",'
        '"correlationId":"$correlation_id","method":"$request_method",'
        '"path":"$uri","status":$status,"durationMs":$request_time,'
        '"upstream":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 512;

    # Rate limits, as a coarse denial-of-service guard -- NOT as the anti-sniping
    # control.
    #
    # docs/11 §4 proposes a tight per-IP bucket (10 bookings/min) to blunt seat
    # sniping. Keying that tightly on $binary_remote_addr is wrong for this
    # market: Sri Lankan mobile carriers put thousands of subscribers behind
    # carrier-grade NAT, so a handful of shared IPs carry a large share of real
    # traffic. A 10/min per-IP booking limit throttles legitimate passengers on
    # the busiest networks while barely inconveniencing an attacker, who can
    # rotate addresses cheaply. It optimises against the wrong adversary.
    #
    # The actual control against inventory freezing is MAX_ACTIVE_HOLDS_PER_CONTACT,
    # enforced inside the booking transaction where it cannot be evaded by
    # changing IP. That is the check that matters, and it already exists.
    #
    # So these buckets are sized to absorb a legitimate burst -- a family booking
    # six seats, a page that fires several quotes, a peak-release crowd sharing a
    # NAT gateway -- while still stopping a runaway client. Per-identity limits
    # belong at the API manager once tokens exist, keyed on the subject rather
    # than the address.
    limit_req_zone $binary_remote_addr zone=reads:10m  rate=600r/m;
    limit_req_zone $binary_remote_addr zone=writes:10m rate=300r/m;
    limit_req_status 429;

    upstream booking { server booking-service:8081; keepalive 32; }
    upstream catalog { server catalog-service:8082; keepalive 32; }
    upstream pricing { server pricing-service:8083; keepalive 32; }

    proxy_http_version 1.1;
    proxy_set_header Connection           "";
    proxy_set_header Host                 $host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto    $scheme;
    proxy_set_header X-Correlation-Id     $correlation_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Security headers. Never a wildcard CORS origin -- the allowlist is config.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # -------------------------------------------------------------------------
    # :8080 -- the API surface. Used by the demo scripts, curl and Swagger UI.
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location = /healthz { access_log off; return 200 '{"status":"UP"}'; }

        # Catalog: the network. Long-lived, safely cached.
        location /api/v1/stations { limit_req zone=reads burst=200 nodelay; proxy_pass http://catalog; }
        location /api/v1/routes   { limit_req zone=reads burst=200 nodelay; proxy_pass http://catalog; }

        # Pricing: quotes and the published tariff.
        location /api/v1/quotes     { limit_req zone=reads burst=100 nodelay; proxy_pass http://pricing; }
        location /api/v1/fare-rules { limit_req zone=reads burst=100 nodelay; proxy_pass http://pricing; }

        # Booking. Still the tighter bucket of the two, but sized to admit a real
        # peak-release crowd behind one NAT gateway rather than to police them.
        location /api/v1/bookings { limit_req zone=writes burst=100 nodelay; proxy_pass http://booking; }

        # Everything else on the booking service: trips, availability, seat map.
        location /api/v1/trips { limit_req zone=reads burst=200 nodelay; proxy_pass http://booking; }

        # Reporting.
        #
        # NOTE: unauthenticated in this compose profile. In any real deployment
        # these sit behind the admin:read scope, validated at the gateway and
        # re-checked in-service. Exposed here so the admin console is usable in a
        # demo; called out in the README rather than left to be discovered.
        location /api/v1/admin { limit_req zone=reads burst=100 nodelay; proxy_pass http://booking; }

        # Service-to-service only. Trip publication must never be callable from
        # outside the network, so the edge refuses it outright.
        location /api/v1/internal { return 404 '{"code":"NOT_FOUND"}'; }

        location /swagger-ui.html  { proxy_pass http://booking; }
        location /v3/api-docs      { proxy_pass http://booking; }

        location / { return 404 '{"code":"NOT_FOUND","detail":"Unknown route"}'; }
    }

    # -------------------------------------------------------------------------
    # :3000 -- the passenger web app.
    #
    # The SPA and the API share this origin, so the browser makes same-origin
    # requests and there is no CORS involved at all. Fewer moving parts than an
    # allowlist, and one less thing to misconfigure.
    # -------------------------------------------------------------------------
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz { access_log off; return 200 '{"status":"UP"}'; }

        location /api/v1/stations  { proxy_pass http://catalog; }
        location /api/v1/routes    { proxy_pass http://catalog; }
        location /api/v1/quotes    { proxy_pass http://pricing; }
        location /api/v1/fare-rules{ proxy_pass http://pricing; }
        location /api/v1/internal  { return 404 '{"code":"NOT_FOUND"}'; }
        location /api/v1/          { proxy_pass http://booking; }

        # Hashed assets are immutable; index.html must never be cached or users
        # keep running yesterday's bundle against today's API.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA history fallback.
        location / { try_files $uri $uri/ /index.html; }
    }
}
